name: Build Android APK

# Builds an installable release APK in the cloud (no local toolchain needed).
# Runs on every push and can also be triggered manually from the Actions tab.
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create . --platforms=android --org com.dhikrcounter

      - name: Set app display name to DhikrFlow
        run: |
          sed -i 's/android:label="[^"]*"/android:label="DhikrFlow"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Build universal release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: dhikr-counter-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
