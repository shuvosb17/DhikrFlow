name: dhikrflow
description: DhikrFlow - a modern, minimalist Islamic Dhikr Counter (Digital Tasbih) with analytics, streaks and offline-first storage.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Local database (offline-first)
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # Charts / analytics
  fl_chart: ^0.68.0

  # Utilities
  intl: ">=0.19.0 <0.21.0"
  uuid: ^4.5.1
  shared_preferences: ^2.3.2
  collection: ^1.18.0

  # Typography
  google_fonts: ^6.2.1

  # Export (CSV / PDF) + share
  csv: ^6.0.0
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
